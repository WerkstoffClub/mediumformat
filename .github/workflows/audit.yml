name: dependency-audit

on:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "apps/*/package.json"
      - "packages/*/package.json"
  push:
    branches: [main]
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      # No install needed: pnpm audit reads pnpm-lock.yaml.
      - run: pnpm audit --prod --audit-level=high
