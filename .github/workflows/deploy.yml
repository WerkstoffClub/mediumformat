name: deploy

# Deploys the app (API + back-office + storefront) to dd-vps with
# deploy/docker/deploy-app.sh — the same script used from a laptop.
# dd-vps only accepts SSH over Tailscale, so the runner joins the tailnet first.
#
# Run it: GitHub → Actions → deploy → Run workflow (or the API / a Claude session).
# One-time setup (secrets, Tailscale tag, SSH key): see deploy/docker/README.md → "Deploy from GitHub Actions".

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        default: main
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ vars.DEPLOY_SSH_HOST || 'dd-vps.tail9b9f75.ts.net' }}
      SSH_USER: ${{ vars.DEPLOY_SSH_USER || 'root' }}
    steps:
      # Fail in seconds, with a clear list, when the one-time setup is not done yet.
      - name: Check deploy secrets
        id: secrets
        env:
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          for n in TS_OAUTH_SECRET DEPLOY_SSH_KEY; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Deploy not set up::Missing repository secrets:$missing. Add them at https://github.com/${{ github.repository }}/settings/secrets/actions (Repository secrets). See deploy/docker/README.md → Deploy from GitHub Actions."
            exit 1
          fi
          # TS_OAUTH_SECRET may hold an OAuth client secret (preferred: a fresh
          # ephemeral tag:ci node per run) or a Tailscale auth key. Only the
          # prefix is inspected; the value is never printed.
          secret="$(printf '%s' "$TS_OAUTH_SECRET" | tr -d '[:space:]')"
          case "$secret" in
            tskey-client-*)
              [ -n "$TS_OAUTH_CLIENT_ID" ] || { echo "::error title=Deploy not set up::TS_OAUTH_SECRET is an OAuth client secret, so TS_OAUTH_CLIENT_ID is needed too."; exit 1; }
              echo "mode=oauth" >> "$GITHUB_OUTPUT" ;;
            tskey-auth-*)
              echo "::notice::TS_OAUTH_SECRET holds a Tailscale auth key; joining with it (an OAuth client is preferred, see deploy/docker/README.md)."
              echo "mode=authkey" >> "$GITHUB_OUTPUT" ;;
            tskey-api-*)
              echo "::error title=Wrong Tailscale key::TS_OAUTH_SECRET holds a Tailscale API key (tskey-api-…). Use an OAuth client secret (tskey-client-…) from Tailscale → Settings → OAuth clients, or an auth key (tskey-auth-…)."
              exit 1 ;;
            *)
              echo "::error title=Wrong Tailscale key::TS_OAUTH_SECRET is not a Tailscale OAuth client secret (tskey-client-…) or auth key (tskey-auth-…)."
              exit 1 ;;
          esac
          echo "All deploy secrets present."

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mf/shared build

      - name: Join the tailnet (OAuth client)
        if: steps.secrets.outputs.mode == 'oauth'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Join the tailnet (auth key)
        if: steps.secrets.outputs.mode == 'authkey'
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_OAUTH_SECRET }}
          hostname: gha-deploy-${{ github.run_id }}

      # tailscale/github-action reports success even when `tailscale up` never
      # succeeded; fail here with a clear message instead of at SSH.
      - name: Check tailnet connection
        run: |
          if ! sudo tailscale status >/dev/null 2>&1 || [ -z "$(sudo tailscale ip -4 2>/dev/null)" ]; then
            echo "::error title=Tailscale join failed::The runner could not join the tailnet. Tailscale rejected TS_OAUTH_SECRET (expired, revoked, single-use and already used, or not a tskey-client-/tskey-auth- key) or the tag/ACL does not allow it."
            exit 1
          fi
          sudo tailscale ping -c 3 "$SSH_HOST" || { echo "::error::Joined the tailnet but cannot reach $SSH_HOST."; exit 1; }

      - name: SSH key and host
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "::error::DEPLOY_SSH_KEY secret is missing"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Fingerprint only (not secret): compare with `ssh-keygen -lf /root/.ssh/authorized_keys` on the host.
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub \
            || { echo "::error title=Bad DEPLOY_SSH_KEY::DEPLOY_SSH_KEY is not a valid, unencrypted private key (paste the whole file, including the BEGIN/END lines)."; exit 1; }
          echo "DEPLOY_SSH_KEY public key: $(ssh-keygen -lf ~/.ssh/id_ed25519.pub)"
          # Host key fetched over the tailnet (WireGuard-authenticated peer).
          ssh-keyscan -T 20 "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$SSH_USER@$SSH_HOST" true \
            || { echo "::error title=SSH key not authorised::$SSH_HOST refused DEPLOY_SSH_KEY (fingerprint above). Add its public key to /root/.ssh/authorized_keys on the host — deploy/docker/README.md, step 4."; exit 1; }

      - name: Deploy
        run: |
          printf 'SSH_HOST=%s\nSSH_USER=%s\nSSH_PORT=22\nSTACK_DIR=/opt/mediumformat\n' "$SSH_HOST" "$SSH_USER" > deploy/docker/stack.env
          ./deploy/docker/deploy-app.sh

      - name: Smoke check
        run: |
          sleep 15
          for url in https://mediumformat.info/ https://mediumformat.info/backoffice/ "https://mediumformat.info/api/v1/storefront/releases?limit=1"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 10 --retry-all-errors "$url")
            echo "$code $url"
            [ "$code" = 200 ] || exit 1
          done

      # An auth-key node is not ephemeral: log it out so runs leave no devices
      # behind in the tailnet (OAuth runs use ephemeral nodes).
      - name: Leave the tailnet
        if: always() && steps.secrets.outputs.mode == 'authkey'
        run: sudo tailscale logout || true
