<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<title>Medium Format® — Event · Gater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ─── Tokens — same as mockup-gater.html ─── */
  :root{
    --canvas:#0F0F0F;--surface:#0E0E0E;--raised:#1A1A1A;--hairline:#2A2A2A;
    --ink:#FFFFFF;--body:#B4B4B4;--mute:#8A8A8A;--accent:#FFFFFF;--accent-text:#000000;
    --success:#22C55E;--warning:#F59E0B;--danger:#EF4444;
    --success-t:rgba(34,197,94,.12);--warning-t:rgba(245,158,11,.12);--danger-t:rgba(239,68,68,.12);
    --ui:"Geist","Helvetica Neue",Arial,sans-serif;
    --r-sm:4px;--r-md:6px;--r-lg:8px;--r-pill:999px;
    --e2:0 4px 12px rgba(0,0,0,.6);--e3:0 8px 24px rgba(0,0,0,.7);--focus:0 0 0 2px var(--canvas),0 0 0 4px var(--ink);
    --nav-h:56px;
  }
  html[data-theme="light"]{
    --canvas:#F0F0F0;--surface:#FFFFFF;--raised:#F5F5F5;--hairline:#E4E4E4;
    --ink:#000000;--body:#525252;--mute:#6B6B6B;--accent:#000000;--accent-text:#FFFFFF;
    --success:#15803D;--warning:#B45309;--danger:#B91C1C;
    --success-t:rgba(21,128,61,.10);--warning-t:rgba(180,83,9,.10);--danger-t:rgba(185,28,28,.10);
    --e2:0 4px 12px rgba(0,0,0,.12);--e3:0 8px 24px rgba(0,0,0,.16);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{color-scheme:dark;}
  html[data-theme="light"]{color-scheme:light;}
  body{font-family:var(--ui);font-size:14px;line-height:1.5;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased;caret-color:var(--ink);}
  ::selection{background:var(--accent);color:var(--accent-text);}
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:var(--canvas);}
  ::-webkit-scrollbar-thumb{background:var(--hairline);border-radius:3px;}
  a{color:inherit;text-decoration:none;}
  button{font:inherit;color:inherit;}
  :focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm);}
  .num{font-variant-numeric:tabular-nums;}
  .ulink{border-bottom:1px solid var(--hairline);transition:border-color .15s;}
  .ulink:hover{border-color:var(--ink);}

  /* ─── Nav ─── */
  .nav{position:sticky;top:0;z-index:100;height:var(--nav-h);background:var(--surface);border-bottom:1px solid var(--hairline);
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;}
  .brand-wordmark{display:block;height:22px;width:auto;}
  .brand-wordmark-light{display:none;}
  html[data-theme="light"] .brand-wordmark-dark{display:none;}
  html[data-theme="light"] .brand-wordmark-light{display:block;}
  .nav-menu{display:flex;gap:4px;justify-self:center;}
  .nav-link{position:relative;font-size:13px;font-weight:500;color:var(--body);padding:8px 12px;border-radius:var(--r-md);transition:color .15s,background .15s;}
  .nav-link:hover{color:var(--ink);background:var(--raised);}
  .nav-link[aria-current="page"]{color:var(--ink);}
  .nav-link[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-10px;height:2px;background:var(--ink);}
  .nav-actions{display:flex;align-items:center;gap:6px;justify-self:end;}
  .nav-btn{width:38px;height:38px;border-radius:var(--r-md);border:none;background:transparent;color:var(--body);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .nav-btn:hover{background:var(--raised);color:var(--ink);}
  .nav-btn svg{width:18px;height:18px;}
  .seg{display:flex;border:1px solid var(--hairline);border-radius:var(--r-pill);padding:2px;}
  .seg button{font-size:12px;font-weight:500;color:var(--mute);background:transparent;border:none;border-radius:var(--r-pill);padding:6px 12px;min-height:32px;cursor:pointer;}
  .seg button:hover{color:var(--ink);}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-text);}

  /* ─── Page grid: tickets column starts at the top ─── */
  .page{display:grid;grid-template-columns:minmax(0,1fr) 360px;grid-template-areas:"crumbs crumbs" "hero side" "body side";gap:0 32px;padding:0 24px 48px;max-width:1440px;margin:0 auto;align-items:start;}
  .crumbs{grid-area:crumbs;padding:18px 0;font-size:13px;color:var(--mute);display:flex;gap:8px;flex-wrap:wrap;}
  .crumbs a{color:var(--body);}
  .crumbs a:hover{color:var(--ink);}
  .crumbs [aria-current]{color:var(--mute);}
  .hero{grid-area:hero;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px;padding-bottom:32px;}
  .side{grid-area:side;position:sticky;top:calc(var(--nav-h) + 16px);}
  .body{grid-area:body;}

  /* ─── Typographic poster (real flyer replaces it when the listing has one) ─── */
  .poster{aspect-ratio:4/5;border-radius:var(--r-lg);overflow:hidden;position:relative;background:var(--accent);color:var(--accent-text);
    display:flex;flex-direction:column;justify-content:space-between;padding:18px;}
  .poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .poster-top{display:flex;justify-content:space-between;font-size:12px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;}
  .poster-day{font-size:104px;font-weight:600;line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums;}
  .poster-mon{font-size:22px;font-weight:600;letter-spacing:-.03em;margin-top:8px;}
  .poster-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;font-size:13px;font-weight:500;line-height:1.3;}
  .poster-disc{width:44px;height:44px;border-radius:50%;flex-shrink:0;position:relative;
    background:repeating-radial-gradient(circle at 50% 50%,currentColor 0 1px,transparent 1px 3px);opacity:.85;}
  .poster-disc::after{content:"";position:absolute;inset:38%;border-radius:50%;background:currentColor;}

  .badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .tag{display:inline-flex;align-items:center;min-height:24px;font-size:12px;padding:0 9px;border-radius:var(--r-sm);color:var(--body);border:1px solid var(--hairline);white-space:nowrap;}
  .pick{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:var(--r-pill);background:var(--accent);color:var(--accent-text);}
  h1{font-size:48px;font-weight:600;line-height:1.02;letter-spacing:-.05em;margin:14px 0 22px;text-wrap:balance;}
  .facts{display:grid;gap:14px;}
  .fact{display:grid;grid-template-columns:20px minmax(0,1fr);gap:12px;}
  .fact svg{width:18px;height:18px;color:var(--mute);margin-top:2px;}
  .fact b{font-weight:500;display:block;font-size:15px;}
  .fact span{display:block;color:var(--body);font-size:13px;}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;border-radius:var(--r-md);font-size:13px;font-weight:500;border:1px solid var(--hairline);background:transparent;color:var(--ink);cursor:pointer;transition:background .15s,border-color .15s,opacity .15s;}
  .btn:hover{background:var(--raised);border-color:var(--mute);}
  .btn svg{width:16px;height:16px;}
  .btn[aria-pressed="true"] svg{fill:currentColor;}
  .btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent);}
  .btn.primary:hover{opacity:.88;}
  .btn.block{width:100%;min-height:46px;font-size:14px;}
  .btn[aria-disabled="true"]{opacity:.4;pointer-events:none;}

  /* ─── Panels ─── */
  .panel{background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-lg);overflow:hidden;}
  .panel + .panel{margin-top:16px;}
  .mf-panel-hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--accent);color:var(--accent-text);}
  .mf-panel-title{font:500 12px/1 var(--ui);text-transform:uppercase;letter-spacing:.06em;}
  .mf-panel-note{font-size:12px;}
  .pbody{padding:20px 16px;}
  .blurb{font-size:17px;line-height:1.55;max-width:62ch;text-wrap:pretty;}
  .blurb.muted{color:var(--body);font-size:15px;}
  /* hairline grid without filler blocks: each cell draws its right/bottom edge, the panel clips the outer ones */
  .lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin:0 -1px -1px 0;}
  .artist{display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:500;border-right:1px solid var(--hairline);border-bottom:1px solid var(--hairline);}
  .mono-av{width:36px;height:36px;border-radius:50%;border:1px solid var(--hairline);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--body);flex-shrink:0;}
  .artist small{display:block;font-size:12px;color:var(--mute);font-weight:400;}
  dl.details{display:grid;grid-template-columns:150px minmax(0,1fr);}
  dl.details dt,dl.details dd{padding:12px 16px;border-top:1px solid var(--hairline);font-size:14px;}
  dl.details dt{color:var(--mute);}
  dl.details dt:first-of-type,dl.details dd:first-of-type{border-top:none;}
  .mini{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;padding:12px 16px;border-top:1px solid var(--hairline);align-items:center;transition:background .15s;}
  .mini:first-child{border-top:none;}
  .mini:hover{background:var(--raised);}
  .mini-date{text-align:center;border:1px solid var(--hairline);border-radius:var(--r-md);padding:5px 0 4px;font-variant-numeric:tabular-nums;}
  .mini-date b{display:block;font-size:16px;font-weight:600;line-height:1.1;}
  .mini-date span{font-size:10px;font-weight:500;color:var(--mute);text-transform:uppercase;}
  .mini-t{font-size:14px;font-weight:500;line-height:1.3;}
  .mini-m{font-size:12px;color:var(--mute);margin-top:2px;}
  .mini .pick{margin-right:6px;vertical-align:1px;}
  .see-all{display:flex;align-items:center;gap:8px;min-height:48px;padding:0 16px;border-top:1px solid var(--hairline);font-size:13px;font-weight:500;color:var(--body);}
  .see-all:hover{color:var(--ink);background:var(--raised);}
  .see-all svg{width:14px;height:14px;}
  .note{font-size:13px;color:var(--mute);padding:16px;}

  /* ─── Ticket box ─── */
  .tier{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;border-top:1px solid var(--hairline);}
  .tier:first-child{border-top:none;}
  .tier-n{font-weight:500;}
  .tier-p{font-size:13px;color:var(--body);font-variant-numeric:tabular-nums;}
  .tier-p span{color:var(--mute);}
  .stepper{display:flex;align-items:center;border:1px solid var(--hairline);border-radius:var(--r-md);}
  .stepper button{width:36px;height:36px;border:none;background:transparent;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:var(--r-md);}
  .stepper button:hover:not(:disabled){background:var(--raised);}
  .stepper button:disabled{color:var(--mute);opacity:.5;cursor:default;}
  .stepper svg{width:14px;height:14px;}
  .stepper output{min-width:24px;text-align:center;font-variant-numeric:tabular-nums;font-size:14px;font-weight:500;}
  .total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:16px;border-top:1px solid var(--hairline);}
  .total > span{color:var(--body);}
  .total b{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .total small{display:block;font-size:12px;color:var(--mute);text-align:right;}
  .tbox-foot{padding:0 16px 16px;display:grid;gap:10px;}
  .fine{font-size:12px;color:var(--mute);line-height:1.55;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:3px 10px;border-radius:var(--r-pill);white-space:nowrap;}
  .status-pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;}
  /* status inside the accent header: solid surface so the colour reads on both themes */
  .mf-panel-hdr .status-pill{background:var(--surface);}
  .st-on{color:var(--success);}
  .st-risk{color:var(--warning);}
  .st-sold{color:var(--danger);}
  .st-off{color:var(--body);}
  .sample{display:inline-block;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute);border:1px dashed var(--mute);border-radius:var(--r-sm);padding:1px 6px;margin-left:4px;vertical-align:1px;}
  .know{list-style:none;}
  .know li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;padding:12px 16px;border-top:1px solid var(--hairline);font-size:13px;color:var(--body);}
  .know li:first-child{border-top:none;}
  .know svg{width:16px;height:16px;color:var(--mute);margin-top:1px;}
  .know b{color:var(--ink);font-weight:500;}

  .mbar{display:none;}
  .toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,8px);background:var(--accent);color:var(--accent-text);font-size:13px;font-weight:500;padding:10px 16px;border-radius:var(--r-pill);box-shadow:var(--e3);opacity:0;transition:opacity .2s,transform .3s cubic-bezier(.16,1,.3,1);pointer-events:none;z-index:300;}
  .toast.on{opacity:1;transform:translate(-50%,0);}
  .proto-link{position:fixed;right:14px;bottom:16px;z-index:60;font-size:12px;color:var(--body);background:var(--surface);border:1px solid var(--hairline);border-radius:var(--r-pill);padding:6px 12px;box-shadow:var(--e2);}
  .proto-link:hover{color:var(--ink);}
  footer{border-top:1px solid var(--hairline);padding:24px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);}

  @media (max-width:1180px){
    .hero{grid-template-columns:200px minmax(0,1fr);gap:24px;}
    .poster-day{font-size:80px;}
    h1{font-size:40px;}
  }
  @media (max-width:980px){
    .page{grid-template-columns:1fr;grid-template-areas:"crumbs" "hero" "side" "body";}
    .side{position:static;margin-bottom:16px;}
  }
  @media (max-width:640px){
    .nav{grid-template-columns:auto 1fr;padding:0 16px;}
    .nav-menu{display:none;}
    .page{padding:0 16px 96px;}
    .crumbs{padding:12px 0;font-size:12px;}
    .hero{grid-template-columns:1fr;gap:20px;padding-bottom:24px;}
    .poster{aspect-ratio:auto;min-height:200px;}
    .poster-day{font-size:72px;}
    h1{font-size:32px;margin:12px 0 18px;}
    .actions .btn{flex:1 1 auto;white-space:nowrap;padding:0 12px;}
    dl.details{grid-template-columns:104px minmax(0,1fr);}
    .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:150;background:var(--surface);border-top:1px solid var(--hairline);padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:12px;align-items:center;justify-content:space-between;box-shadow:var(--e2);}
    .mbar .p{font-size:12px;color:var(--mute);}
    .mbar .p b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;}
    .proto-link{bottom:80px;}
    footer{padding:16px 16px 96px;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>

document.querySelectorAll('[data-cur]').forEach(b => b.onclick = () => { viewerCur = b.dataset.cur; localStorage.setItem('mf-cur', viewerCur); renderSide(); });

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : null;
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const dayLabel = (iso, opts) => new Date(iso + 'T00:00:00Z').toLocaleDateString('en-GB', {timeZone:'UTC', ...opts});
const idrFull = v => 'Rp ' + Math.round(v).toLocaleString('de-DE');
const idrShort = v => v >= 1e6 ? `Rp ${(v/1e6).toFixed(1).replace('.', ',')} jt` : `Rp ${Math.round(v/1e3)} rb`;
function native(v, cur){
  if (cur === 'IDR') return idrFull(v);
  try { return new Intl.NumberFormat('en', {style:'currency', currency:cur, maximumFractionDigits:0}).format(v); } catch { return `${cur} ${v}`; }
}
function approx(v, cur){
  const idr = v * (FX_IDR[cur] || 0);
  if (!idr) return '';
  if (viewerCur === 'USD') return cur === 'USD' ? '' : `≈ $${Math.round(idr / FX_IDR.USD).toLocaleString('en-US')}`;
  return cur === 'IDR' ? '' : `≈ ${idrShort(idr)}`;
}
const offsetLabel = iso => { const m = iso.match(/([+-])(\d\d):(\d\d)$/); return m ? `GMT${m[1]}${+m[2]}${m[3] !== '00' ? ':' + m[3] : ''}` : ''; };
const sourceName = n => SOURCE[String(n).toLowerCase()] || String(n).replace(/^\w/, c => c.toUpperCase());
const initials = n => n.replace(/\(.*?\)/g, '').split(/\s+/).filter(w => /^[\p{L}\p{N}]/u.test(w)).slice(0, 2).map(w => w[0]).join('').toUpperCase();

const ev = GATER.events.find(e => e.id === new URLSearchParams(location.search).get('id'))
        || GATER.events.find(e => e.id === DEFAULT_ID) || GATER.events[0];
const city = CITY[ev.city];
const tiers = (ev.tiers && ev.tiers.length ? ev.tiers : [{name: ev.kind === 'festival' ? 'Weekend pass' : 'General admission', price: ev.price}])
  .map(t => ({...t, price: t.price ?? ev.price, qty: 0}));
const age = (ev.tags || []).find(t => /^\d+\+$/.test(t));
const zone = ZONE[ev.tz] ? `${ZONE[ev.tz]} (${offsetLabel(ev.start)})` : offsetLabel(ev.start);

function when(){
  const s = ev.start.slice(0, 10), e = ev.end && ev.end.slice(0, 10);
  const multi = e && e !== s && (ev.kind === 'festival' || ev.kind === 'special_show');
  const dates = multi ? `${dayLabel(s, {weekday:'short', day:'numeric', month:'short'})} – ${dayLabel(e, {weekday:'short', day:'numeric', month:'short', year:'numeric'})}`
                      : dayLabel(s, {weekday:'long', day:'numeric', month:'long', year:'numeric'});
  const until = ev.end && !multi ? `–${ev.end.slice(11, 16)}` : '';
  return {dates, time: `${ev.start.slice(11, 16)}${until} ${zone}`};
}
function yourTime(){
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  if (!tz || tz === ev.tz) return '';
  const t = new Date(ev.start).toLocaleString('en-GB', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit', timeZone: tz});
  return `${t} your time (${tz.split('/').pop().replace('_', ' ')})`;
}
function ticketState(){
  if (ev.gater) return ['st-on', 'On sale on Gater'];
  if (ev.ticket === 'sold_out') return ['st-sold', 'Sold out'];
  if ((ev.tags || []).includes('sold-out-risk') && ev.ticket === 'on_sale') return ['st-risk', 'Selling fast'];
  return {on_sale:['st-on', 'On sale'], free:['st-off', 'Free entry'], door:['st-off', 'Pay at the door']}[ev.ticket] || ['st-off', 'Not on sale yet'];
}
const sellerUrl = () => safeUrl(ev.ticketUrl) || safeUrl((ev.sources || []).map(s => s[1]).find(safeUrl));
const sellerName = () => sourceName((ev.sources || []).find(s => s[1] === sellerUrl())?.[0] || 'the seller');
const mapsUrl = () => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent([ev.venue, ev.address, city.name].filter(Boolean).join(', '));

function posterHtml(){
  const img = safeUrl(ev.image);
  const d = ev.start.slice(0, 10);
  return `<div class="poster">
    ${img ? `<img src="${esc(img)}" alt="Flyer for ${esc(ev.title)}" loading="eager">` : `
    <div class="poster-top"><span>${esc(city.name)}</span><span>${esc(KIND[ev.kind] || 'Event')}</span></div>
    <div><div class="poster-day">${+d.slice(8)}</div><div class="poster-mon">${dayLabel(d, {month:'long', year:'numeric'})}</div></div>
    <div class="poster-foot"><span>${esc(ev.venue)}<br>${ev.start.slice(11, 16)} ${esc(ZONE[ev.tz] || offsetLabel(ev.start))}</span><span class="poster-disc" aria-hidden="true"></span></div>`}
  </div>`;
}
function renderHero(){
  const w = when(), yt = yourTime();
  $('crumbs').innerHTML = `<a href="mockup-gater.html">Events</a><span aria-hidden="true">/</span><a href="mockup-gater.html?city=${city.slug}">${esc(city.name)}</a><span aria-hidden="true">/</span><span aria-current="page">${esc(ev.title)}</span>`;
  document.title = `Medium Format® — ${ev.title} · ${city.name}`;
  $('hero').innerHTML = `${posterHtml()}
    <div>
      <div class="badges">${ev.pick ? '<span class="pick">Gater Pick</span>' : ''}<span class="tag">${KIND[ev.kind] || 'Event'}</span>${(ev.genres || []).slice(0, 3).map(g => `<span class="tag">${esc(g)}</span>`).join('')}</div>
      <h1>${esc(ev.title)}</h1>
      <div class="facts">
        <div class="fact">${ICON.cal}<div><b class="num">${w.dates}</b><span class="num">${w.time}</span>${yt ? `<span>${esc(yt)}</span>` : ''}</div></div>
        <div class="fact">${ICON.pin}<div><b>${esc(ev.venue)}</b><span>${esc([ev.address, city.name].filter(Boolean).join(' · '))}</span>
          <span style="margin-top:4px"><a class="ulink" href="${mapsUrl()}" target="_blank" rel="noopener">Directions in Google Maps</a></span></div></div>
        ${ev.lineup ? `<div class="fact">${ICON.note}<div><b>${esc(ev.lineup.slice(0, 4).join(', '))}</b>${ev.lineup.length > 4 ? `<span><a class="ulink" href="#lineup">and ${ev.lineup.length - 4} more</a></span>` : ''}</div></div>` : ''}
      </div>
      <div class="actions">
        <button class="btn" id="ics">${ICON.add}Add to calendar</button>
        <button class="btn" id="share">${ICON.share}Share</button>
        <button class="btn" id="save" aria-pressed="false">${ICON.heart}<span>Save</span></button>
      </div>
    </div>`;
  $('ics').onclick = downloadIcs;
  $('share').onclick = share;
  $('save').onclick = e => { const b = e.currentTarget, on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', on); b.querySelector('span').textContent = on ? 'Saved' : 'Save'; toast(on ? 'Saved to your events' : 'Removed from your events'); };
}

function mini(e, showCity){
  const d = e.start.slice(0, 10);
  return `<a class="mini" href="mockup-gater-event.html?id=${encodeURIComponent(e.id)}"><div class="mini-date"><b>${+d.slice(8)}</b><span>${dayLabel(d, {month:'short'})}</span></div>
    <div><div class="mini-t">${e.pick ? '<span class="pick">Pick</span>' : ''}${esc(e.title)}</div><div class="mini-m">${showCity ? esc(CITY[e.city]?.name) + ' · ' : ''}${esc(e.venue)} · ${e.start.slice(11, 16)}</div></div></a>`;
}
function renderBody(){
  const blurb = ev.blurb ? `<p class="blurb">${esc(ev.blurb)}</p>`
    : `<p class="blurb muted">${esc(KIND[ev.kind] || 'Event')} at ${esc(ev.venue)}, ${esc(city.name)}${ev.lineup ? `, with ${esc(ev.lineup.slice(0, 3).join(', '))}` : ''}.</p>`;
  const tags = (ev.tags || []).filter(t => TAG[t]).map(t => `<span class="tag">${TAG[t]}</span>`).join('');
  const sources = (ev.sources || []).map(([n, u]) => safeUrl(u) ? `<a class="ulink" href="${esc(u)}" target="_blank" rel="noopener">${esc(sourceName(n))}</a>` : esc(sourceName(n))).join(', ');
  const w = when();
  const from = addDays(ev.start.slice(0, 10), -NEARBY_DAYS), to = addDays((ev.end || ev.start).slice(0, 10), NEARBY_DAYS);
  const nearby = GATER.events.filter(e => e.id !== ev.id && e.city === ev.city && e.start.slice(0, 10) >= from && e.start.slice(0, 10) <= to);
  const sameCountry = GATER.events.filter(e => e.city !== ev.city && CITY[e.city]?.country === city.country && e.status === 'featured'
    && Math.abs((new Date(e.start) - new Date(ev.start)) / 864e5) <= 14);
  $('body').innerHTML = `
    <section class="panel"><div class="mf-panel-hdr"><h2 class="mf-panel-title">About</h2>${ev.status === 'featured' ? '<span class="mf-panel-note">Written by Gater</span>' : ''}</div>
      <div class="pbody">${blurb}${tags ? `<div class="badges" style="margin-top:16px">${tags}</div>` : ''}</div></section>
    ${ev.lineup ? `<section class="panel" id="lineup"><div class="mf-panel-hdr"><h2 class="mf-panel-title">Lineup</h2><span class="mf-panel-note num">${ev.lineup.length} artist${ev.lineup.length > 1 ? 's' : ''}</span></div>
      <div class="lineup">${ev.lineup.map((a, i) => `<div class="artist"><span class="mono-av" aria-hidden="true">${esc(initials(a))}</span><div>${esc(a)}${i === 0 ? '<small>Headliner</small>' : ''}</div></div>`).join('')}</div></section>` : ''}
    <section class="panel"><div class="mf-panel-hdr"><h2 class="mf-panel-title">Details</h2></div>
      <dl class="details">
        <dt>When</dt><dd class="num">${w.dates}<br>${w.time}</dd>
        <dt>Where</dt><dd>${esc(ev.venue)}${ev.address ? `<br><span style="color:var(--body)">${esc(ev.address)}</span>` : ''}</dd>
        ${ev.genres ? `<dt>Music</dt><dd>${esc(ev.genres.join(', '))}</dd>` : ''}
        ${age ? `<dt>Age</dt><dd>${age} only, bring photo ID</dd>` : ''}
        ${ev.priceNote ? `<dt>Door price</dt><dd>${esc(ev.priceNote)}</dd>` : ''}
        ${ev.promoter ? `<dt>Promoter</dt><dd>${esc(ev.promoter)}</dd>` : ''}
        <dt>Sources</dt><dd>${sources}</dd>
        <dt>Last checked</dt><dd class="num">${GATER.asOf ? dayLabel(GATER.asOf, {day:'numeric', month:'long', year:'numeric'}) : '—'}</dd>
      </dl></section>
    <section class="panel"><div class="mf-panel-hdr"><h2 class="mf-panel-title">Also in ${esc(city.name)}</h2><span class="mf-panel-note num">${dayLabel(from, {day:'numeric', month:'short'})}–${dayLabel(to, {day:'numeric', month:'short'})}</span></div>
      ${nearby.length ? nearby.slice(0, 6).map(e => mini(e)).join('') : `<div class="note">Nothing else listed in ${esc(city.name)} around these dates yet.</div>`}
      <a class="see-all" href="mockup-gater.html?city=${city.slug}&from=${from}&to=${to}">See everything in ${esc(city.name)} on these dates ${ICON.arrow}</a>
    </section>
    ${sameCountry.length ? `<section class="panel"><div class="mf-panel-hdr"><h2 class="mf-panel-title">Elsewhere in ${esc(city.country === 'ID' ? 'Indonesia' : city.name)}</h2><span class="mf-panel-note">Within 2 weeks</span></div>${sameCountry.slice(0, 4).map(e => mini(e, true)).join('')}</section>` : ''}`;
}

function renderSide(){
  const [stCls, stTxt] = ticketState();
  const total = tiers.reduce((s, t) => s + (t.price || 0) * t.qty, 0);
  const count = tiers.reduce((s, t) => s + t.qty, 0);
  let box;
  if (ev.gater && ev.price){
    box = `${tiers.map((t, i) => `<div class="tier">
        <div><div class="tier-n">${esc(t.name)}</div><div class="tier-p">${t.price ? esc(native(t.price, ev.cur)) : 'Price to be announced'} <span>${t.price ? approx(t.price, ev.cur) : ''}</span></div></div>
        <div class="stepper" role="group" aria-label="${esc(t.name)} quantity">
          <button data-i="${i}" data-d="-1" aria-label="One fewer" ${t.qty ? '' : 'disabled'}>${ICON.minus}</button>
          <output aria-live="polite">${t.qty}</output>
          <button data-i="${i}" data-d="1" aria-label="One more" ${t.qty >= MAX_QTY || !t.price ? 'disabled' : ''}>${ICON.plus}</button>
        </div></div>`).join('')}
      <div class="total"><span>${count ? `${count} ticket${count > 1 ? 's' : ''}` : 'Choose tickets'}</span><div><b>${esc(native(total, ev.cur))}</b><small>${approx(total, ev.cur) ? approx(total, ev.cur) + ' · ' : ''}Fees shown at checkout</small></div></div>
      <div class="tbox-foot">
        <a class="btn primary block" href="mockup-checkout.html" ${count ? '' : 'aria-disabled="true" tabindex="-1"'}>${count ? `Buy ${count} on Gater` : 'Buy on Gater'}</a>
        <p class="fine">Max ${MAX_QTY} per order.${ev.demoGater ? '<span class="sample">Sample</span>' : ''}</p>
      </div>`;
  } else {
    const url = sellerUrl();
    const from = ev.price ? `<div class="total" style="border-top:none"><span>From</span><div><b>${esc(native(ev.price, ev.cur))}</b><small>${approx(ev.price, ev.cur)}</small></div></div>` : '';
    const link = url && ev.ticket !== 'door' ? `<a class="btn primary block" href="${esc(url)}" target="_blank" rel="noopener">Tickets via ${esc(sellerName())} ${ICON.out}</a>` : '';
    box = `${from}
      <div class="tbox-foot" style="${from ? '' : 'padding-top:16px'}">
        ${link}
        <button class="btn block${link ? '' : ' primary'}" id="notify">Tell me when it's on Gater</button>
        <p class="fine">${ev.ticket === 'door' ? 'Entry is paid at the door. ' : ''}Not sold on Gater yet, so we link to the official seller${ev.cur && ev.cur !== 'IDR' ? ' (their currency; conversion is approximate)' : ''}.</p>
      </div>`;
  }
  const know = [
    [ICON.clock, `Times are local: <b>${esc(zone)}</b>`],
    age && [ICON.id, `<b>${age}</b> only, bring photo ID`],
    ev.gater && [ICON.qr, 'QR e-ticket by email and in your account'],
    ev.gater && [ICON.card, 'QRIS, virtual account, e-wallet or card'],
  ].filter(Boolean);
  $('side').innerHTML = `<div class="panel"><div class="mf-panel-hdr"><h2 class="mf-panel-title">Tickets</h2><span class="status-pill ${stCls}">${stTxt}</span></div>${box}</div>
    <div class="panel"><ul class="know">${know.map(([i, t]) => `<li>${i}<span>${t}</span></li>`).join('')}</ul></div>`;
  const label = ev.price ? native(ev.price, ev.cur) : (ev.priceNote || (ev.ticket === 'free' ? 'Free' : 'To be announced'));
  $('mbar').innerHTML = `<div class="p">${ev.price ? 'From' : 'Price'}<b>${esc(label)}</b></div><a class="btn primary" href="#side" style="min-width:150px">${ev.gater ? 'Buy on Gater' : 'Get tickets'}</a>`;
  document.querySelectorAll('[data-cur]').forEach(b => b.setAttribute('aria-pressed', b.dataset.cur === viewerCur));
}
$('side').onclick = e => {
  const b = e.target.closest('[data-i]');
  if (b){ const t = tiers[+b.dataset.i]; t.qty = Math.max(0, Math.min(MAX_QTY, t.qty + +b.dataset.d)); renderSide(); $('side').querySelector(`[data-i="${b.dataset.i}"][data-d="${b.dataset.d}"]`)?.focus(); return; }
  if (e.target.closest('#notify')) toast("We'll email you when tickets go on sale on Gater");
};

function downloadIcs(){
  const stamp = iso => new Date(iso).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const end = ev.end || new Date(new Date(ev.start).getTime() + 4 * 3600e3).toISOString();
  const clean = s => String(s).replace(/([,;\\])/g, '\\$1').replace(/\n/g, '\\n');
  const ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Medium Format//Gater//EN','BEGIN:VEVENT',
    `UID:${ev.id}@gater.mediumformat.info`, `DTSTAMP:${stamp(new Date().toISOString())}`, `DTSTART:${stamp(ev.start)}`, `DTEND:${stamp(end)}`,
    `SUMMARY:${clean(ev.title)}`, `LOCATION:${clean([ev.venue, ev.address, city.name].filter(Boolean).join(', '))}`,
    `DESCRIPTION:${clean((ev.lineup || []).join(', '))}`, `URL:${location.href}`, 'END:VEVENT','END:VCALENDAR'].join('\r\n');
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(new Blob([ics], {type:'text/calendar'})), download: `${ev.id}.ics`});
  a.click(); URL.revokeObjectURL(a.href);
  toast('Calendar file downloaded');
}
async function share(){
  try {
    if (navigator.share) return await navigator.share({title: ev.title, text: `${ev.title} · ${city.name}`, url: location.href});
    await navigator.clipboard.writeText(location.href); toast('Link copied');
  } catch (err) { if (err.name !== 'AbortError') toast('Copy the link from the address bar'); }
}
function toast(msg){ const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); }

renderHero(); renderBody(); renderSide();
</script>
</body>
</html>
