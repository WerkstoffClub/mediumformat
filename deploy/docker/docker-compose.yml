# ==========================================================================
# Medium Format — production stack on dd-vps (seedlink VPS), /opt/mediumformat.
# Migrated 2026-11-13 from vps.lacak.live (Traefik) to dd-vps.
#
# dd-vps has NO public 80/443: traffic arrives through a Cloudflare Tunnel
# (`mediumformat-dd-vps`, systemd unit `cloudflared-mediumformat`) that points
# mediumformat.info, www, dealers., peers. at http://127.0.0.1:3300. Caddy is a plain HTTP
# server on :80; TLS lives at Cloudflare. www→apex and http→https redirects
# are done in the Caddyfile.
#
# Deploy:
#     rsync this folder to /opt/mediumformat   (sync.sh does the site)
#     cd /opt/mediumformat && docker compose up -d
#
# API-written files persist under /opt/mediumformat/data (bind mounts below).
# ==========================================================================

services:
  web:
    image: caddy:2-alpine
    container_name: mediumformat-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges=true
    networks:
      - mf_internal
    volumes:
      - /opt/mediumformat/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/mediumformat/site:/srv:ro
    ports:
      - "127.0.0.1:3300:80"   # cloudflared tunnel -> mediumformat
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ── Real app: NestJS API + Postgres (reached via Caddy path routes) ──
  db:
    image: postgres:16-alpine
    container_name: mediumformat-db
    restart: unless-stopped
    env_file:
      - /opt/mediumformat/api.env   # POSTGRES_DB/USER/PASSWORD live here
    networks:
      - mf_internal
    volumes:
      - mf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: /opt/mediumformat/app-src
      dockerfile: Dockerfile.api
    image: mediumformat-api:latest
    container_name: mediumformat-api
    volumes:
      # Persist files the API writes (public /uploads/ + import attachments in .uploads).
      - /opt/mediumformat/data/uploads:/repo/apps/api/uploads
      - /opt/mediumformat/data/import-uploads:/repo/apps/api/.uploads
    restart: unless-stopped
    env_file:
      - /opt/mediumformat/api.env
    networks:
      - mf_internal
    depends_on:
      db:
        condition: service_healthy

volumes:
  mf_pg_data:

networks:
  mf_internal: {}
